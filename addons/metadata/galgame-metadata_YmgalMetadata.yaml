AddonId: YmgalMetadata_2460c7c5-5f79-4ebe-826d-cba2084e2464
Type: MetadataProvider
Name: Ymgal Metadata Provider
Author: galgame-metadata
ShortDescription: 从 Ymgal 月幕 Galgame 抓取中文元数据：名称、简介、开发商、发行商、发售日、类型、封面与背景图。
InstallerManifestUrl: https://raw.githubusercontent.com/ListenToAether/playnite-galgame-metadata/main/manifests/YmgalMetadata.yaml
SourceUrl: https://github.com/ListenToAether/playnite-galgame-metadata
Description: |-
  为 Playnite 添加资料数据来源「Ymgal Metadata Provider」，可在「下载元数据」里作为独立来源勾选。
  - 支持按名称自动匹配，或在游戏链接中放入 https://www.ymgal.games/ga<ID> 精确匹配
  - 可刮削名称、原名、别名、中文简介、开发商、发行商、发售日期、类型、封面
  - 内置手动确认窗口：搜索后由你挑选正确条目并点选背景图
  - 设置界面与提示均为中文
  更多说明见项目主页 README。
Tags: ["Metadata", "Galgame", "Visual Novel", "Chinese", "Ymgal"]
Links:
