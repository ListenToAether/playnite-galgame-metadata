Type: MetadataProvider
Name: Hikarinagi Metadata Provider
Author: galgame-metadata
ShortDescription: 从 Hikarinagi 抓取元数据：名称、简介、开发商、发行商、平台、引擎、标签、封面与截图。
InstallerManifestUrl: https://raw.githubusercontent.com/ListenToAether/playnite-galgame-metadata/main/manifests/HikarinagiMetadata.yaml
SourceUrl: https://github.com/ListenToAether/playnite-galgame-metadata
Description: |-
  为 Playnite 添加资料数据来源「Hikarinagi Metadata Provider」，可在「下载元数据」里作为独立来源勾选。
  - 支持按名称自动匹配，或在游戏链接中放入 https://www.hikarinagi.org/galgames/<ID> 精确匹配
  - 可刮削名称、原名、英文名、简介、开发商、发行商、平台、引擎、标签、封面与背景图
  - 自动过滤站点里的导演、画师、声优等人员标签
  - 中文界面
  更多说明见项目主页 README。
Tags: ["Metadata", "Galgame", "Visual Novel", "Hikarinagi"]
