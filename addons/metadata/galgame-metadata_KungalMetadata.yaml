AddonId: KungalMetadata_664139ab-88b1-4be5-869e-592b81e21df6
Type: MetadataProvider
Name: Kungal Metadata Provider
Author: galgame-metadata
ShortDescription: 从 Kungal 鲲 Galgame 抓取元数据：名称、多语言简介、开发商、发行商、标签、评分、封面、背景图与全部 CG 截图。
InstallerManifestUrl: https://raw.githubusercontent.com/zxc34731116797/playnite-galgame-metadata/main/manifests/KungalMetadata.yaml
SourceUrl: https://github.com/zxc34731116797/playnite-galgame-metadata
Description: |-
  为 Playnite 添加资料数据来源「Kungal Metadata Provider」，可在「下载元数据」里作为独立来源勾选。
  - 支持按名称自动匹配，或在游戏链接中放入 https://www.kungal.com/galgame/<ID> 精确匹配
  - 可刮削名称、多语言简介、开发商、发行商、标签、评分（自动换算成百分制）
  - 带完整截图集（实测单作 25 张 CG），可在窗口里逐张挑选作为背景图
  - 数据来自 NextMoe Catalog 公开接口
  更多说明见项目主页 README。
Tags: ["Metadata", "Galgame", "Visual Novel", "Chinese", "Kungal"]
Links:
