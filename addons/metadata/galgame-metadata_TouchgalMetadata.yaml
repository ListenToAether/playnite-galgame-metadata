AddonId: TouchgalMetadata_af145bc3-1883-4933-a1d7-d5124de2cccd
Type: MetadataProvider
Name: TouchGAL Metadata Provider
Author: galgame-metadata
ShortDescription: 从 TouchGAL 抓取元数据：名称、别名、简介、开发商、评分、标签、封面与背景图（需自备 API Token）。
InstallerManifestUrl: https://raw.githubusercontent.com/ListenToAether/playnite-galgame-metadata/main/manifests/TouchgalMetadata.yaml
SourceUrl: https://github.com/ListenToAether/playnite-galgame-metadata
Description: |-
  为 Playnite 添加资料数据来源「TouchGAL Metadata Provider」，可在「下载元数据」里作为独立来源勾选。
  - 使用 TouchGAL 官方开发者 API，需要你在 https://developer.touchgal.com 申请一个 Token 并填进插件设置
  - 可刮削名称、别名、简介、开发商、评分、标签、类型、平台、封面与背景图
  - 支持按名称自动匹配，或在游戏链接中放入 https://www.touchgal.com/galgame/<8位ID> 精确匹配
  - 中文界面
  更多说明见项目主页 README。
Tags: ["Metadata", "Galgame", "Visual Novel", "Chinese", "TouchGAL"]
Links:
